  callback_url: http://116.196.116.76/yifan.php  # 亦凡API回调地址（中转服务器）
  query_url: http://116.196.116.76/yifan.php  # 订单查询页面地址
COOKIES:
  last_update_time: ''
  value: ''
DEFAULT_HEADERS:
  accept: application/json
  accept-language: zh-CN,zh;q=0.9
  cache-control: no-cache
  origin: https://www.goofish.com
  pragma: no-cache
  priority: u=1, i
  referer: https://www.goofish.com/
  sec-ch-ua: '"Not(A:Brand";v="99", "Google Chrome";v="133", "Chromium";v="133"'
  sec-ch-ua-mobile: ?0
  sec-ch-ua-platform: '"Windows"'
  sec-fetch-dest: empty
  sec-fetch-mode: cors
  sec-fetch-site: same-site
  user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
    like Gecko) Chrome/133.0.0.0 Safari/537.36
HEARTBEAT_INTERVAL: 15
HEARTBEAT_TIMEOUT: 30
LOG_CONFIG:
  compression: zip
  format: '<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level>
    | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>'
  level: INFO
  retention: 7 days
  rotation: 1 day
MANUAL_MODE:
  enabled: false
  timeout: 3600
  toggle_keywords: []
MESSAGE_EXPIRE_TIME: 300000
RISK_CONTROL:
  backoff_escalation_factor: 1.5
  backoff_max_cap_seconds: 3600
  consecutive_failure_protection_threshold: 5
  max_post_slider_session_retries: 1
  soft_auth_token_preflight_enabled: true
  soft_auth_token_preflight_timeout_seconds: 5.0
  soft_auth_token_preflight_qr_enabled: false
  night_cookie_refresh_multiplier: 2
  night_end_hour: 7
  night_keepalive_multiplier: 3
  night_mode_enabled: true   # 夜间模式默认开启(0-7点)：夜间回复/发货延迟与保活降频；置 false 可关
  night_start_hour: 0
  qr_login_grace_minutes: 15
  post_slider_retry_delay_max: 10.0
  post_slider_retry_delay_min: 5.0
  token_refresh_dedup_window_seconds: 60
  token_retry_min_wait_seconds: 180
  # Token 预检连续失败退避（秒）：10分钟 → 30分钟 → 2小时，达到次数或命中账号级风控后停止
  token_recovery_backoff_schedule_seconds: [600, 1800, 7200]
  token_recovery_max_attempts: 5
  # 停止后再过这么多秒才允许重新开始一轮预算，避免平台冷却结束后永久卡死
  token_recovery_hold_seconds: 21600
  # 扫码成功但没预热到 Token 时，新实例首次预检前等待秒数
  token_preflight_settle_seconds: 5
  # 扫码稳定期结束后预检失败的重试上限；只有成功才记完成，避免一次令牌过期把复查用掉
  token_recovery_grace_recheck_max_attempts: 3
  # 拟人化：付款到自动发货之间的随机延迟区间(秒)，秒发是机器人签名
  auto_delivery_delay_range: [20, 90]
  # 拟人化：夜间窗口内发货延迟拉长(秒)，真人卖家凌晨处理更慢
  auto_delivery_night_delay_range: [180, 900]
  # 普通客服夜间保持秒级响应，显式运营配置仍可覆盖
  night_reply_delay_range: [2, 10]
  # 自动滑块恢复默认关闭：pureCaptcha/RGV587 是纯黑处罚页，继续拉浏览器会被当成脚本升级封禁
  auto_captcha_recovery_enabled: false
  # 履约一致性巡检：平台 shipped 但本地无 finalized 的扫描间隔（秒）
  delivery_gap_scan_interval: 300
  # 巡检命中后是否自动尝试补写发货凭证（仅在已有已送达内容时补写，绝不新发卡密）
  delivery_gap_auto_retry: true
  # 待发货订单滞留多少分钟后告警运营方
  delivery_gap_pending_ship_alert_minutes: 15
  # 发货失败（私聊回执超时等）是否主动告警运营方
  delivery_failure_alert_enabled: true
DELIVERY:
  # 发货凭证直填（tradeText）总开关：网盘链接+提取码直接写进平台发货凭证，HTTP 发货与私聊解耦；
  # 置 false 完全回落旧私聊链路（行为与改造前一致），灰度回滚只改这一行
  trade_text_enabled: true
  # 发货凭证长度上限（字符），超长截断
  trade_text_max_length: 500
  # 凭证接口失败时是否回落旧私聊链路（true = 不倒退）
  trade_text_fallback_to_chat: true
  # 私聊补充告知失败是否忽略（true = 平台凭证已发货，私聊失败不影响履约；缺口仍会记账并告警）
  chat_notify_best_effort: true
  # ── 双通道改造：发货凭证直填与私信通知各自独立记账/巡检/补发 ──
  # 私信缺口自动补发总开关（发货凭证已送达 + 私信未送达时，用原样快照补发私信；false = 只告警不补发）
  chat_gap_auto_resend_enabled: true
  # 私信自动补发最大次数，达到后停止重试并转人工告警
  chat_gap_resend_max_attempts: 3
  # 首次发现私信缺口到首次自动补发的宽限秒数（900=15分钟：覆盖扫码稳定期，并留出
  # 「已在App手工补发→调 manual-mark 结案」的反应窗口，防止买家收到重复消息）
  chat_gap_resend_grace_seconds: 900
  # 私信补发失败的退避基准秒数（指数翻倍，上限取 RISK_CONTROL.backoff_max_cap_seconds）
  chat_gap_resend_backoff_base_seconds: 1800
  # 私信缺口扫描时间窗（小时）
  chat_gap_scan_window_hours: 72
  # 掉线恢复在线后一次性补拉掉线期间订单（防掉线失明；复用近期订单巡检，自带6小时鉴权失败退避）
  orders_recovery_sync_enabled: true
  # 掉线恢复补拉最小间隔秒数（防重连风暴反复拉单）
  orders_recovery_sync_min_interval_seconds: 1800
  # 掉线恢复补拉延迟秒数（等连接稳定）
  orders_recovery_sync_delay_seconds: 60
TOKEN_REFRESH_INTERVAL: 72000  # AccessToken 仅在初始化/重连前按需刷新，默认20小时
TOKEN_RETRY_INTERVAL: 600
SESSION_KEEPALIVE_INTERVAL: 600  # 使用 loginuser.get 的轻量保活周期，默认10分钟
SESSION_KEEPALIVE_RETRY_INTERVAL: 180  # 轻量保活失败后的重试间隔，默认3分钟
SLIDER_VERIFICATION:
  max_concurrent: 3  # 滑块验证最大并发数
  wait_timeout: 60   # 等待排队超时时间（秒）
WEBSOCKET_HEADERS:
  Accept-Encoding: gzip, deflate, br, zstd
  Accept-Language: zh-CN,zh;q=0.9
  Cache-Control: no-cache
  Connection: Upgrade
  Host: wss-goofish.dingtalk.com
  Origin: https://www.goofish.com
  Pragma: no-cache
  User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
    like Gecko) Chrome/133.0.0.0 Safari/537.36
WEBSOCKET_URL: wss://wss-goofish.dingtalk.com/
